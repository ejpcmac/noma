[package]
name = "noma-hello-fw"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A device that says hello."

[features]
# NOTE: This feature is enabled in `.vscode/settings.json` and can be used to
# enable some features when editing the code without impacting the default
# features.
rust-analyzer = [
    # "feather-nrf52840",
    "nucleo-l476rg",
]
# Board support
feather-nrf52840 = ["noma-platform-devboard/feather-nrf52840"]
nucleo-l476rg = [
    "embassy-time/tick-hz-1_000",
    "noma-platform-devboard/nucleo-l476rg",
]

[dependencies]
cortex-m = { version = "0.7", features = [
    "critical-section-single-core",
    "inline-asm",
] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
embassy-executor = { version = "0.7.0", features = [
    "arch-cortex-m",
    "defmt",
    "executor-thread",
] }
embassy-time = { version = "0.4.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
noma-hello-app = { path = "../noma-hello-app", features = ["embedded-hal"] }
noma-platform-devboard = { path = "../../../../platform/noma-platform-devboard", features = [
    "embassy",
] }
panic-probe = { version = "0.3", features = ["print-defmt"] }

# For `cargo fix` to work.
[[bin]]
name = "noma-hello-fw"
test = false
bench = false

[lints]
workspace = true
